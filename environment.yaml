name: commec-dev
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10
  # Runtime Python dependencies
  - numpy
  - pandas
  - pytaxonkit
  - pyyaml
  - typer
  - quickdna
  - needletail
  # Runtime non-Python dependencies
  - blast>=2.17
  - diamond>=2.1
  - hmmer
  - infernal
  - plotly
  - yaml
  - mako
  - wget
  # Development dependencies
  - pip
  - pytest
  - matplotlib
  - ruff
